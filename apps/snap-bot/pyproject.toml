[project]
name = "snap-bot"
version = "0.1.0"
description = "Snap Bot V2 runtime."
requires-python = ">=3.11"
dependencies = ["studio-core"]

[project.scripts]
snap-bot = "snap_bot.cli:main"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snap_bot"]
