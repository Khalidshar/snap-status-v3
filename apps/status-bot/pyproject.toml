[project]
name = "status-bot"
version = "0.1.0"
description = "Status Bot V2 runtime."
requires-python = ">=3.11"
dependencies = ["studio-core"]

[project.scripts]
status-bot = "status_bot.cli:main"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["status_bot"]
