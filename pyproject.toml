[project]
name = "snap-status-v3"
version = "0.1.0"
description = "Workspace root for Snap Bot V2, Status Bot V2 and the shared studio-core."
requires-python = ">=3.11"
dependencies = ["studio-core", "snap-bot", "status-bot"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/studio-core", "apps/snap-bot", "apps/status-bot"]

[tool.uv.sources]
studio-core = { workspace = true }
snap-bot = { workspace = true }
status-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/studio-core/tests", "apps/snap-bot/tests", "apps/status-bot/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]

[tool.coverage.run]
branch = true
source = ["studio_core", "snap_bot", "status_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
# str+Enum is kept on purpose: StrEnum changes str() output of persisted states.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
# SQL schema and statements stay byte-identical to the verified lab core: the
# schema text is persisted in the sqlite_master of every existing database.
"packages/studio-core/studio_core/jobs/repository.py" = ["E501"]

# Snap app graduated from the lab as-is (behaviour proven by its 550 lab tests).
# Debt, paid down module by module like the core: see docs/GRADUATION.md.
"apps/snap-bot/snap_bot/*.py" = ["E501", "F401", "SIM105", "RUF001", "B904", "S110", "S603", "SIM102", "B905", "RUF005", "E731", "S607", "S310", "F841", "S608", "E402", "RUF059", "RUF007"]
"apps/snap-bot/tests/*.py" = ["SIM117", "F401", "E501", "B023", "RUF059", "RUF001", "S603", "S608", "B905", "B017", "E731", "S106", "F841", "S607", "RUF007", "RUF005", "B008", "S311", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["studio_core", "snap_bot", "status_bot"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["studio_core", "snap_bot", "status_bot"]

[[tool.mypy.overrides]]
# Untyped Snap modules graduated as-is; each leaves this list when it is typed (GRADUATION.md).
module = [
    "snap_bot.actions_preview",
    "snap_bot.agent_contract_map",
    "snap_bot.agent_telemetry",
    "snap_bot.arabic_agent",
    "snap_bot.command_transport",
    "snap_bot.command_worker",
    "snap_bot.content_agents",
    "snap_bot.did_you_know",
    "snap_bot.editorial_agents",
    "snap_bot.fact_audio",
    "snap_bot.fact_layout",
    "snap_bot.fact_motion",
    "snap_bot.final_agent",
    "snap_bot.font_admission",
    "snap_bot.maintenance",
    "snap_bot.n1_artifacts",
    "snap_bot.n1_contracts",
    "snap_bot.n1_control",
    "snap_bot.n1_coordinator",
    "snap_bot.n1_generations",
    "snap_bot.n1_ipc",
    "snap_bot.n1_journal_service",
    "snap_bot.n1_partial_tail",
    "snap_bot.n1_segments",
    "snap_bot.n1_writer",
    "snap_bot.n1_writer_service",
    "snap_bot.oversight_agents",
    "snap_bot.owned_contract_adapter",
    "snap_bot.render",
    "snap_bot.render_agents",
    "snap_bot.render_commit",
    "snap_bot.schedule_once",
    "snap_bot.send_evidence",
    "snap_bot.send_reconciliation",
    "snap_bot.server_preview",
    "snap_bot.service",
    "snap_bot.telegram_egress",
    "snap_bot.weather",
]
ignore_errors = true
