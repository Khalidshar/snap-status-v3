[project]
name = "snap-status-v3"
version = "0.1.0"
description = "Workspace root for Snap Bot V2, Status Bot V2 and the shared studio-core."
requires-python = ">=3.11"
dependencies = ["studio-core", "snap-bot", "status-bot"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/studio-core", "apps/snap-bot", "apps/status-bot"]

[tool.uv.sources]
studio-core = { workspace = true }
snap-bot = { workspace = true }
status-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/studio-core/tests", "apps/snap-bot/tests", "apps/status-bot/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]

[tool.coverage.run]
branch = true
source = ["studio_core", "snap_bot", "status_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
# str+Enum is kept on purpose: StrEnum changes str() output of persisted states.
ignore = ["UP042"]
# Arabic text is the product: its letters and digits are intended, not look-alikes.
allowed-confusables = ["ا", "٠", "١", "٥", "٧", "٫"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
# SQL schema and statements stay byte-identical to the verified lab core: the
# schema text is persisted in the sqlite_master of every existing database.
"packages/studio-core/studio_core/jobs/repository.py" = ["E501"]

# App source keeps only E501: its SQL statements stay byte-identical (CREATE text is
# persisted in sqlite_master) and its CSS/HTML strings are not worth splitting.
# Test files: debt, paid down like the core (docs/GRADUATION.md).
"apps/snap-bot/snap_bot/*.py" = ["E501"]
"apps/snap-bot/tests/*.py" = ["SIM117", "F401", "E501", "B023", "RUF059", "RUF001", "S603", "S608", "B905", "B017", "E731", "S106", "F841", "S607", "RUF007", "RUF005", "B008", "S311", "S101"]
"apps/status-bot/status_bot/*.py" = ["E501"]
"apps/status-bot/tests/*.py" = ["RUF059", "SIM117", "F401", "B023", "B017", "S106", "S105", "S608", "E501", "F841", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["studio_core", "snap_bot", "status_bot"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["studio_core", "snap_bot", "status_bot"]
