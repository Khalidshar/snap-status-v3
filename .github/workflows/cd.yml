name: CD

on:
  push:
    branches: [main]
    tags: ["snap-bot-v*", "status-bot-v*"]
  workflow_dispatch:
    inputs:
      app:
        description: App to ship
        type: choice
        options: [all, snap-bot, status-bot]
        default: all
      production:
        description: Promote to production after staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  plan:
    name: Release plan
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      version: ${{ steps.plan.outputs.version }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_PRODUCTION: ${{ inputs.production }}
        run: scripts/release-plan.sh

  publish:
    name: Publish ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DOCKER_BUILD_FLAGS: --cache-from type=gha,scope=${{ matrix.app }}
        run: scripts/build.sh --push "${{ matrix.app }}"

  staging:
    name: Staging ${{ matrix.app }}
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    environment:
      name: ${{ matrix.app }}-staging
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh "${{ matrix.app }}" staging "${{ needs.plan.outputs.version }}"

  production:
    name: Production ${{ matrix.app }}
    needs: [plan, staging]
    if: needs.plan.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    environment:
      name: ${{ matrix.app }}-production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh "${{ matrix.app }}" production "${{ needs.plan.outputs.version }}"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
