name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  changes:
    name: Detect affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/changed-apps.sh "$BASE_SHA" HEAD

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages
      - run: scripts/lint.sh

  test:
    name: Tests (Python ${{ matrix.python }})
    # Pinned: the Snap render profile requires FFmpeg 6.1.1-3ubuntu5 from Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Real FFmpeg/ffprobe and fonts for the Snap render tests; no publishing or secrets.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-freefont-ttf fonts-hosny-amiri
      - run: uv sync --all-packages
      - run: node apps/snap-bot/tests/run_agent_runtime.mjs
      - run: scripts/test.sh all
        env:
          MADAR_REQUIRE_REAL_RENDER: "1"
      # Deliberate guard deletions: each must be caught by its named test.
      - if: matrix.python == '3.12'
        run: uv run --frozen python scripts/check_core_mutations.py
      # Reports are a convenience: a full storage quota must not fail passing tests.
      - if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-reports-py${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 3

  app-mutations:
    name: App guard mutations
    # Same pinned runner and media stack as the tests: render guards need real FFmpeg.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-freefont-ttf fonts-hosny-amiri
      - run: uv sync --all-packages
      # Deliberate Snap guard deletions (ported lab tools): each must fail its named test.
      - run: uv run --frozen python scripts/check_app_mutations.py --jobs 4
        env:
          MADAR_REQUIRE_REAL_RENDER: "1"

  status-render:
    name: Status real render
    # Disposable root runner with systemd: a real no-Internet FFmpeg render of synthetic
    # weather, which must stay ineligible for WhatsApp. No credentials, no sending.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Non-interactive, no man-db rebuild, bounded downloads and dpkg-lock waits: this
      # step hung several times on runners before any test ran.
      - timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          sudo -E apt-get "${apt_opts[@]}" update -qq
          sudo -E apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-freefont-ttf
      - run: uv sync --all-packages
      - run: sudo -n "$(uv run --frozen python -c 'import sys; print(sys.executable)')" scripts/check_status_weather_render.py

  release-install:
    name: Release install
    # Disposable root runner with systemd: a real install of this commit into a temporary
    # root, then cutover and rollback to a lab release, then a real Status preview.
    # check_env runs for real as the non-root runner account. Nothing is sent.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          sudo -E apt-get "${apt_opts[@]}" update -qq
          sudo -E apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-freefont-ttf
      # --status-render also runs the installed Status controller: live public weather
      # (keyless, allowlisted hosts only), a no-network render, and no delivery.
      - run: sudo -n /usr/bin/python3 scripts/check_release_install.py --node-bin "$(command -v node)" --status-render

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: scripts/secret-scan.sh "$RANGE"

  workflow-lint:
    name: Workflow & shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: shellcheck
        run: shellcheck -x scripts/*.sh

  build:
    name: Image ${{ matrix.app }}
    needs: [changes, lint, test]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build wheels and image
        env:
          DOCKER_BUILD_FLAGS: --cache-from type=gha,scope=${{ matrix.app }} --cache-to type=gha,mode=max,scope=${{ matrix.app }}
        run: scripts/build.sh "${{ matrix.app }}"
      - name: Offline smoke test
        run: scripts/smoke.sh "${{ matrix.app }}"

  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, lint, test, app-mutations, status-render, release-install, secret-scan, workflow-lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed or be skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI gates passed"
