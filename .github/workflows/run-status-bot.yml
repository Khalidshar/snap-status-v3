name: Run Status Bot

# Runtime entrypoint for the deployed :production image. No schedule on purpose:
# status_scheduler_enabled stays false until its readiness gate passes (docs/DECISIONS.md).
on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options: [healthcheck, dry-run]
        default: healthcheck

permissions:
  contents: read
  packages: read

concurrency:
  group: run-status-bot
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-bot.yml
    with:
      app: status-bot
      command: ${{ inputs.command }}
