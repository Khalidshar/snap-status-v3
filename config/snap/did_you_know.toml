app = "snap-bot-v2"
mode = "foundation-test"
data_root = "../.did-you-know-state"

[gateway]
commands = ["did_you_know"]
rate_window = 60
rate_limit = 2
max_active_per_actor = 1
signature_skew_seconds = 60
[gateway.owners]
telegram = ["manual-test-owner"]

[jobs]
lease_seconds = 30
aging_seconds = 60
max_running = 1
[jobs.budgets]
CRITICAL = 180
HIGH = 600
NORMAL = 600
BACKGROUND = 1200
[storage]
retention_seconds = 86400
[network]
socket = "egress.sock"
hosts = []
user_agent = "SnapStudioV2/0.2 github.com/Khalidshar"
timeout_seconds = 15
max_bytes = 1048576

[slice]
# Example only: pin the existing test owner, Linux UIDs, paths and font/tool profile before manual use.
input_root = "/run/studio-v2-facts/input/renders"
spool_root = "/run/studio-v2-facts/spool/renders"
render_socket = "/run/studio-v2-facts/render.sock"
worker_uid = 1001
renderer_uid = 1002
city = "الرياض"
ttl_seconds = 3600
egress_socket = "/run/studio-v2-snap-weather/egress.sock"
[slice.profile]
width = 1080
height = 1920
fps = 24
duration_seconds = 8
max_bytes = 50000000
crf = 25
preset = "ultrafast"
timeout_seconds = 240
ffmpeg = "/usr/bin/ffmpeg"
ffprobe = "/usr/bin/ffprobe"
ffmpeg_version = "ffmpeg version 6.1.1-3ubuntu5 Copyright (c) 2000-2023 the FFmpeg developers"
font = "assets/fonts/notokufiarabic/NotoKufiArabic-Bold.ttf"
font_sha256 = "549173578b9ca93ac8b458e5a4cc3262db9a35992d0bfbc80835d92a621655fc"
latin_font = "assets/fonts/cairo/Cairo-Regular.ttf"
latin_font_sha256 = "d82f9e84b1a7fbc7dc25d332c851fdb3d1af6a814e8793e1421b6b3652b90f0f"
fc_query = "/usr/bin/fc-query"
# Sacred kinds (hadith, dua): the verbatim body is shaped whole by pango, never by drawtext.
pango_view = "/usr/bin/pango-view"
pango_version = "pango-view (pango) 1.52.1"
sacred_font = "assets/fonts/notonaskharabic/NotoNaskhArabic-Regular.ttf"
sacred_font_sha256 = "0919edeba540a6b27875d4651f2bf26dcbae00324b4bb034f7a030f7f294d381"
sacred_font_size = 60
# The approved personal frame (brand_frame.py); every fact video is framed before QA.
brand_frame = "rawwag"


fact_body_font_size = 68
fact_line_width = 20
font_manifest = "assets/fonts/manifest.json"
font_manifest_sha256 = "9c6d55bf81b0928a03c18fc01b1ca3f28c931e64222f3e8774760fba91cf80e0"

font_fallbacks = ["assets/fonts/notonaskharabic/NotoNaskhArabic-Regular.ttf", "assets/fonts/cairo/Cairo-Regular.ttf", "assets/fonts/arabeyes/ae_AlMohanad.ttf"]

