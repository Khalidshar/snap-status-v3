app = "status-bot-v2"
mode = "foundation-test"
data_root = "/var/lib/madar/status/news"

[gateway]
commands = ["weather"]
rate_window = 60
rate_limit = 2
max_active_per_actor = 1
signature_skew_seconds = 60
[gateway.owners]
scheduler = ["foundation-test-owner"]

[jobs]
lease_seconds = 600
aging_seconds = 60
max_running = 1
[jobs.budgets]
CRITICAL = 180
HIGH = 600
NORMAL = 600
BACKGROUND = 1200
[storage]
retention_seconds = 86400
[network]
socket = "/var/lib/madar/status/news/egress.sock"
hosts = ["aawsat.com", "aitnews.com", "ar.harpersbazaararabia.com", "feeds.bbci.co.uk", "www.alhadath.net", "www.france24.com", "www.skynewsarabia.com", "www.tech-wd.com"]
user_agent = "StatusStudioV2/0.2 github.com/Khalidshar"
timeout_seconds = 8
max_bytes = 2097152

